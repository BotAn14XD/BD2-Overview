{% extends "main.html" %}

{% block content %}
  <h1><b>404 - Page Not Found</b></h1>
  <div style="display: flex; align-items: center; gap: 20px; margin-top: 1rem;">
    <img src="{{ base_url }}assets/images/site/illust_npcface2001340136_10.avif" 
         alt="404" 
         style="width: 100px; opacity: 0.8;">
    
    <div>
        <p style="margin: 0; font-size: 1.1rem; font-weight: bold;">
            Lost in the Mist?
        </p>
        <p style="margin: 5px 0 0;">
            It looks like you've wandered into an uncharted part of the map.
        </p>
    </div>
</div>
<div style="margin-top: 2rem; width: 100%;">
    <form action="{{ 'search.html' | url }}" method="get" style="position: relative; width: 100%;">
        <input type="text" name="q" placeholder="Search for gear or guides..." 
               style="width: 100%; padding: 12px 15px; border-radius: 8px; border: 1px solid var(--md-typeset-table-color); background: var(--md-code-bg-color); color: var(--md-typeset-color); box-sizing: border-box;">
        <button type="submit" style="position: absolute; right: 15px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer;">
            🔍
        </button>
    </form>
</div>
  <a href="{{ base_url }}" class="md-button md-button--primary" style="margin-top: 1rem; width:100%; text-align:center">
    Back to Main Menu
  </a>


{% endblock %}
