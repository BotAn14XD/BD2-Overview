site_name: "Brown Dust II: Tactical Compendium"
site_description: "Brown Dust II Features, Modes Overview and Tips"
site_url: https://botan14xd.github.io/BD2-Overview/
site_author: BotAn
theme:  
  name: material
  custom_dir: overrides
  static_templates:
    - 404.html
  favicon: assets/images/site-assets/favicon.png
  logo: assets/images/site-assets/logo.png
  font: false
  palette:
    - scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Switch to light mode
    - scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
  features:
    - navigation.top
    - lazyload
#    - content.tabs.link
    - navigation.instant
    - toc.follow
    - navigation.tracking
#    - navigation.tabs
#    - navigation.sections
    - search.suggest
    - search.highlight
    - search.share
nav:
    - 'Main Page': index.md
    - 'Game Mechanics':
        - 'Battle System': mechanics/battle.md
        - 'Damage Formula': mechanics/damage-formula.md

    - 'Characters Progression':
        - 'Burst System': progression/burst.md
        - 'Gear System': progression/gear.md  
        - 'Potential Liberation': progression/potentials.md
    - 'Game Content':
        - 'Content Packs':
            - 'Mirror Wars': content-packs/mirror-wars.md
            - 'Evil Castle': content-packs/evil-castle.md
            # - 'Path of Adventure': content-packs/path-of-adventure.md
            # - 'Last Night': content-packs/last-night.md
            # - 'Glupy Diner': content-packs/glupy-diner.md
            # - 'Golden Colosseum': content-packs/golden-colosseum.md
            # - 'Fantasia Square': content-packs/fantasia-square.md
            - 'The Soul Wager': content-packs/soul-wager.md
        - 'Fiend Hunter': content/fh.md
        - 'Rapport': content/rapport.md
        - 'Season Events': content/events.md
        - 'Taros Tactical Manual': content/ttm.md
        - 'Territory': content/territory.md
    - 'Miscellaneous':
        - 'Game Slang': misc/slang.md
    - 'Common Questions': FAQ.md
    - '---': '#'
    - 'Survey': survey.md
    - 'Banner Recommendations': https://zormolo.github.io/BD2-Banner-Recommendation/
    - 'Our Discord Server': https://discord.gg/tays83ew3N
repo_name: BotAn14XD/BD2-Overview
repo_url: https://github.com/BotAn14XD/BD2-Overview
extra_css:
  - stylesheets/fonts.css
  - stylesheets/main.css
  - stylesheets/survey.css
  - stylesheets/rapport.css
  - stylesheets/slang.css
  - stylesheets/print.css
  - assets/katex/katex.min.css
extra_javascript:
  - javascripts/main.js
  - javascripts/rapport.js
  - assets/katex/katex.min.js
  - assets/katex/contrib/auto-render.min.js
  - javascripts/katex-config.js
plugins:
  - search
  - minify:
      minify_html: true
      minify_js: true
      minify_css: true
      htmlmin_opts:
          remove_comments: true
  - open-in-new-tab:
      add_icon: true
  - glightbox:
      skip_classes:
        - icon
        - icon-header
        - icon-list
        - card-header-img
        - tile-image
        - table-icon
  - git-revision-date-localized:
      type: date
      timezone: UTC
  - macros
  - redirects:
      redirect_maps:
        'game-mechanics/gear-system.md': 'progression/gear.md'
        'game-mechanics/battle-system.md': 'mechanics/battle.md'
        'game-mechanics/damage-formula.md': 'mechanics/damage-formula.md'
        'character-progression/burst.md': 'progression/burst.md'
        'character-progression/gear-system.md': 'progression/gear.md'
        'character-info/potential-liberation.md': 'progression/potentials.md'
        'miscellaneous/game-slang.md': 'misc/slang.md'

markdown_extensions:
  - attr_list
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - md_in_html
  - def_list
#  - pymdownx.blocks.grid
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      separator: "-"
      permalink: true

extra:
  social_image: assets/images/site-assets/banner.png
  analytics:
      provider: google
      property: G-K5ZWHH7K1V
  I: '<span class="num">I</span>'
  II: '<span class="num">II</span>'
  III: '<span class="num">III</span>'
  IV: '<span class="num">IV</span>'
  EX: '<span class="num">EX</span>'

