name: Publish to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

      - name: Set up Python 3.x
        uses: actions/setup-python@v5
        with:
          python-version: 3.x

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt

      - name: Build Static Site Layout
        run: properdocs build

      - name: Install Puppeteer Engine
        run: npm install puppeteer

      - name: Auto-Capture Term Card Screenshots
        run: node screenshots.js

      - name: Build Redirect Channels
        run: python preview-generator.py

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          force_orphan: true

      - name: Notify Discord
        if: success()
        run: |
          cat << 'EOF' > commit_msg.txt
          ${{ github.event.head_commit.message }}
          EOF
          if grep -qi "\[notify\]" commit_msg.txt; then
            JSON_MSG=$(jq -Rs '.' commit_msg.txt)
            PAYLOAD="{\"content\": $JSON_MSG}"
            curl -H "Content-Type: application/json" \
                 -X POST \
                 -d "$PAYLOAD" \
                 ${{ secrets.DISCORD_WEBHOOK_URL }}
          fi