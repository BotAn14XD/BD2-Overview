site_name: Brown Dust II Overview
site_description: "Brown Dust II Features, Modes Overview and Tips"
theme:  
  name: material
  favicon: assets/images/site/favicon.png
  logo: assets/images/site/logo.png
  palette:
    scheme: slate  # Dark mode
    primary: indigo
    accent: cyan
  features:
    - navigation.top
    - lazyload
#    - content.tabs.link
    - navigation.instant
    - navigation.tracking
#    - navigation.tabs
#    - navigation.sections
nav:
#    - Home: index.md
    - 'Game Mechanics':
        - 'Battle System': game-mechanics/battle-system.md
    - 'Characters info':
        - 'Potential Liberation': character-info/potential-liberation.md
    - 'Content Packs':
        - 'Mirror Wars': content-packs/mirror-wars.md
        - 'Evil Castle': content-packs/evil-castle.md
        - 'Path of Adventure': content-packs/path-of-adventure.md
        - 'Last Night': content-packs/last-night.md
        - 'Glupy Diner': content-packs/glupy-diner.md
        - 'Golden Colosseum': content-packs/golden-colosseum.md
        - 'Fantasia Square': content-packs/fantasia-square.md
repo_name: BotAn14XD/BD2-Overview
repo_url: https://github.com/BotAn14XD/BD2-Overview
extra_css:
  - stylesheets/extra.css
  - https://unpkg.com/katex@0/dist/katex.min.css
extra_javascript:
  - javascripts/extra.js
  - javascripts/katex.js
  - https://unpkg.com/katex@0/dist/katex.min.js
  - https://unpkg.com/katex@0/dist/contrib/auto-render.min.js
plugins:
  - search
  - minify:
      minify_html: true
      minify_js: true
      minify_css: true
      htmlmin_opts:
          remove_comments: true
  - open-in-new-tab:
      add_icon: true
  - glightbox:
      skip_classes:
        - icon
        - icon-header
        - icon-list
  - git-revision-date-localized:
      type: date
      timezone: UTC
  - macros
markdown_extensions:
  - attr_list
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - md_in_html
  - pymdownx.superfences
  - def_list
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      separator: "-"
